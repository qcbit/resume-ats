apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resume-ingress
  namespace: default
  annotations:
    # Increase the time Nginx waits for a response from the backend
    # Value is in seconds. Default is often 60. Increase as needed.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    # You might also consider increasing send/connect timeouts if needed
    # nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
    # nginx.ingress.kubernetes.io/proxy-connect-timeout: "10" # Usually keep this lower
spec:
  rules:
  - host: localhost
    http:
      paths:
      # API path
      - pathType: Prefix
        path: /api
        backend:
          service:
            name: resume-backend
            port:
              number: 5000
      # Frontend path
      - pathType: Prefix
        path: /
        backend:
          service:
            name: resume-frontend
            port:
              number: 80
