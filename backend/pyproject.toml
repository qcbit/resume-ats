[project]
name = "resume-ats"
version = "0.1.0"
description = "Resume/ATS Scoring Service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.6.0",
    "argparse>=1.4.0",
    "datasets>=3.5.0",
    "flask>=3.1.0",
    "fuzzywuzzy>=0.18.0",
    "huggingface-hub>=0.30.2",
    "joblib>=1.4.2",
    "loguru>=0.7.3",
    "nltk>=3.9.1",
    "openai>=1.76.0",
    "pandas>=2.2.3",
    "python-levenshtein>=0.27.1",
    "scikit-learn>=1.6.1",
    "sentence-transformers>=4.1.0",
    "torch>=2.6.0",
    "transformers>=4.51.3",
    "uv>=0.6.14",
    "uvicorn>=0.34.2",
]

[tool.uv.workspace]
members = [
    "services/job-title-detector",
    "services/keywords-extractor",
    "services/keywords-extractor-openai",
    "services/keywords-extractor-llm",
    "services/keywords-extractor-llm-quantized",
    "services/match-scorer",
    "services/match-scorer-ollama",
    "services/match-scorer-openai",
]
