apiVersion: apps/v1
kind: Deployment
metadata:
  name: match-scorer
  labels:
    app: match-scorer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: match-scorer
  template:
    metadata:
      labels:
        app: match-scorer
    spec:
      containers:
      - name: match-scorer
        image: match-scorer:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        env:
        - name: PORT
          value: "5000"
---
apiVersion: v1
kind: Service
metadata:
  name: match-scorer
  labels:
    app: match-scorer
spec:
  selector:
    app: match-scorer
  ports:
  - protocol: TCP
    port: 5000
    targetPort: 5000
  type: ClusterIP
